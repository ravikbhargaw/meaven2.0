<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="canonical" href="https://meaven.in/review.html">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="shortcut icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="favicon.png">
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-M041N6068W"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-M041N6068W');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Thank you for working with Meaven Designs. Share your feedback on our commercial interior glass execution.">
    <title>Review Meaven Designs - Commercial Glass Execution Partner</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    
    <style>
        .review-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: var(--space-md);
            text-align: center;
            background-color: var(--bg-primary);
            position: relative;
            z-index: 1;
        }

        .review-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
            pointer-events: none;
            z-index: -1;
        }

        .review-card {
            background: var(--bg-card);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            border: 1px solid var(--border-medium);
            padding: clamp(2.5rem, 6vw, 4rem) clamp(1.5rem, 5vw, 3rem);
            border-radius: var(--radius-lg);
            max-width: 520px;
            width: 100%;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2.25rem;
            transition: var(--transition);
        }

        .review-card:hover {
            border-color: var(--border-glow);
            box-shadow: 0 25px 60px rgba(201, 165, 92, 0.05);
        }

        .review-logo {
            height: 44px;
            width: auto;
            margin-bottom: 0.5rem;
            transition: var(--transition);
        }

        .review-logo:hover {
            transform: scale(1.05);
        }

        .review-title {
            font-size: clamp(1.75rem, 5vw, 2.25rem);
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1.25;
            margin: 0;
        }

        .review-title em {
            font-style: normal;
            color: var(--accent);
        }

        .review-text {
            color: var(--text-secondary);
            font-size: 1.05rem;
            line-height: 1.6;
            margin: 0;
        }

        .review-btn {
            font-size: 1.05rem;
            padding: 1.125rem 3rem;
            width: 100%;
            max-width: 320px;
            box-shadow: 0 4px 24px rgba(201, 165, 92, 0.25);
            margin-top: 0.5rem;
        }

        .review-footer {
            margin-top: 2rem;
            font-size: 0.8rem;
            color: var(--text-muted);
            letter-spacing: 0.05em;
        }
    </style>
</head>
<body>

    <div class="review-wrapper">
        <div class="review-glow"></div>
        
        <div class="review-card animate-reveal">
            <img src="images/logo.png" alt="Meaven Designs Logo" class="review-logo">
            
            <div style="display: flex; flex-direction: column; gap: 1rem;">
                <h1 class="review-title">Thank you for working with <em>Meaven.</em></h1>
                <p class="review-text">We appreciate your partnership. Your feedback helps us maintain and improve our workspace execution standards.</p>
            </div>
            
            <a href="https://g.page/r/CUOCqVTPISA3EBM/review" target="_blank" rel="noopener" class="btn btn-primary review-btn">
                Leave a Review
            </a>
        </div>
        
        <div class="review-footer animate-reveal" style="transition-delay: 0.15s;">
            &copy; 2026 Meaven Intelligence. All rights reserved.
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
